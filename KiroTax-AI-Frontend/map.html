<!DOCTYPE html>
<html>
<head>
  <title>ORS Route Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin:0; font-family: Arial; }
    #map { height: 100vh; }
    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      z-index: 1000;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="panel">
  <button onclick="getRoute()">Get Route</button>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const API_KEY = "YOUR_API_KEY";   // 🔴 PUT YOUR ORS KEY

// Initial map
const map = L.map('map').setView([28.6139, 77.2090], 12); // Delhi

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

let routeLayer;

// Example coordinates
const start = [77.2090, 28.6139];  // Delhi
const end   = [77.1025, 28.7041];  // North Delhi

async function getRoute() {

  const url = `https://api.openrouteservice.org/v2/directions/driving-car?api_key=${API_KEY}&start=${start[0]},${start[1]}&end=${end[0]},${end[1]}`;

  const response = await fetch(url);
  const data = await response.json();

  const coords = data.features[0].geometry.coordinates;

  const latlngs = coords.map(c => [c[1], c[0]]);

  if(routeLayer) map.removeLayer(routeLayer);

  routeLayer = L.polyline(latlngs, {color:'blue', weight:5}).addTo(map);

  map.fitBounds(routeLayer.getBounds());
}
</script>

</body>
</html>
